name: Sync Sodick-CRM from SRC

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:15 UTC
    - cron: "15 2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror SRC to DST
        env:
          SRC_PAT_DA: ${{ secrets.SRC_PAT_DA }}
          DST_PAT_DA: ${{ secrets.DST_PAT_DA }}
        run: |
          set -euo pipefail

          git clone --mirror "https://x-access-token:${SRC_PAT_DA}@github.com/SDGD365/Sodick-CRM.git" repo.git
          cd repo.git

          git remote set-url --push origin "https://x-access-token:${DST_PAT_DA}@github.com/dynamicavenuegmbh/Sodick-CRM.git"

          git push --mirror